  name: Build Mi A3 Custom Kernel (laurel_sprout)

  on:
    workflow_dispatch:   # Manual trigger from Actions tab
    push:
      branches: [ lineage-23.2 ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout kernel source
          uses: actions/checkout@v4

        - name: Install toolchain
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              gcc-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi \
              bc bison flex libssl-dev make cpio

        - name: Create custom config fragment
          run: |
            cat > arch/arm64/configs/vendor/laurel_sprout-custom.config << 'CONFIGEOF'
            CONFIG_IR_MSM_GENI=y
            CONFIG_RC_CORE=y
            CONFIG_USB_DWC3_DUAL_ROLE=y
            CONFIGEOF

        - name: Configure kernel
          run: |
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/atoll-perf_defconfig
            scripts/kconfig/merge_config.sh -m -O . .config \
              arch/arm64/configs/vendor/laurel_sprout.config \
              arch/arm64/configs/vendor/laurel_sprout-custom.config
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        - name: Fix GCC 13+ compatibility
          run: |
            sed -i '1s/^/#ifndef __has_attribute\n#define __has_attribute(x) 0\n#endif\n/' include/linux/compiler_types.h

        - name: Fix bolero format strings
          run: |
            sed -i 's/"%s: register macro successful:%d\\n"/"register macro successful:%d\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-cdc.c
            sed -i 's/"%s: dev is null %d\\n"/"%s: dev is null\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-clk-rsc.c

        - name: Fix cam_trace.h include path
          run: |
            sed -i 's|#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils|' \
              drivers/media/platform/msm/camera/cam_utils/cam_trace.h

        - name: Fix DTC overlay and diagnose
          run: |
            set -x
            DIAGNOSTIC=1

            # --- DIAGNOSE: before fix ---
            echo "=== BEFORE FIX: sdmmagpie-thermal-overlay.dtsi ==="
            wc -l arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            head -20 arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi

            # Check include-prefixes symlink
            echo "=== include-prefixes check ==="
            ls -la scripts/dtc/include-prefixes/ 2>/dev/null || echo "MISSING: scripts/dtc/include-prefixes/"
            ls -la scripts/dtc/include-prefixes/dt-bindings/ 2>/dev/null || echo "MISSING: dt-bindings symlink"
            readlink -f scripts/dtc/include-prefixes/dt-bindings 2>/dev/null || echo "BROKEN symlink"

            # --- FIX 1: Add -D defines to dtc_cpp_flags ---
            echo 'dtc_cpp_flags += -DTHERMAL_NO_LIMIT="(~0)" -DTHERMAL_MAX_LIMIT="((~0)-1)"' >> scripts/Makefile.lib

            # --- FIX 2: sed THERMAL_* replacement ---
            sed -i '/#include <dt-bindings\/thermal\/thermal.h>/d' \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            sed -i 's/THERMAL_NO_LIMIT/0xFFFFFFFF/g' \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            sed -i 's/THERMAL_MAX_LIMIT/0xFFFFFFFE/g' \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi

            # --- DIAGNOSE: after fix ---
            echo "=== AFTER FIX: sdmmagpie-thermal-overlay.dtsi ==="
            head -20 arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            grep -n 'THERMAL\|#include' arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi; true

            # --- DIAGNOSE: preprocess and check ---
            echo "=== CPP PREPROCESSED (first 30 lines) ==="
            aarch64-linux-gnu-cpp -nostdinc -I scripts/dtc/include-prefixes \
              -undef -D__DTS__ -x assembler-with-cpp \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi \
              -o /tmp/sdmmagpie-preproc.dts 2>&1
            head -30 /tmp/sdmmagpie-preproc.dts
            wc -l /tmp/sdmmagpie-preproc.dts

        - name: Build kernel + DTBs
          run: |
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error" -j Image.gz dtbs

        - name: Concatenate kernel + DTB
          run: |
            cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/xiaomi/laurel_sprout-trinket-base.dtb \
              > arch/arm64/boot/Image.gz-dtb
            ls -lh arch/arm64/boot/Image.gz-dtb

        - name: Upload Image.gz-dtb
          uses: actions/upload-artifact@v4
          with:
            name: Image.gz-dtb
            path: arch/arm64/boot/Image.gz-dtb
            if-no-files-found: error