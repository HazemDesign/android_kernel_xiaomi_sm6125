  name: Build Mi A3 Custom Kernel (laurel_sprout)

  on:
    workflow_dispatch:   # Manual trigger from Actions tab
    push:
      branches: [ lineage-23.2 ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout kernel source
          uses: actions/checkout@v4

        - name: Install toolchain
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              gcc-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi \
              bc bison flex libssl-dev make cpio

        - name: Create custom config fragment
          run: |
            cat > arch/arm64/configs/vendor/laurel_sprout-custom.config << 'CONFIGEOF'
            # Custom config for Mi A3 (laurel_sprout) - IR + OTG + Magisk fix

            # === IR Blaster ===
            CONFIG_IR_MSM_GENI=y
            CONFIG_RC_CORE=y

            # === USB OTG (DWC3 dual-role) ===
            CONFIG_USB_DWC3_DUAL_ROLE=y

            # === Magisk fix: disable static usermodehelper ===
            # CONFIG_STATIC_USERMODEHELPER is not set
            CONFIGEOF

        - name: Configure kernel (base + fragments + custom)
          run: |
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/atoll-perf_defconfig
            scripts/kconfig/merge_config.sh -m -O . .config \
              arch/arm64/configs/vendor/laurel_sprout.config \
              arch/arm64/configs/vendor/laurel_sprout-custom.config
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        - name: Fix GCC 13+ compatibility for kernel 4.14
          run: |
            sed -i '1s/^/#ifndef __has_attribute\n#define __has_attribute(x) 0\n#endif\n/' include/linux/compiler_types.h
            head -6 include/linux/compiler_types.h

        - name: Fix bolero format strings (GCC 13+ -Werror=format)
          run: |
            sed -i 's/"%s: register macro successful:%d\\n"/"register macro successful:%d\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-cdc.c
            sed -i 's/"%s: dev is null %d\\n"/"%s: dev is null\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-clk-rsc.c

        - name: Fix cam_trace.h include path for GCC 13+
          run: |
            # TRACE_INCLUDE_PATH is resolved relative to include/trace/ (where define_trace.h lives)
            # ../../drivers/... navigates FROM include/trace/ UP to kernel root, then into camera dir
            sed -i 's|#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils|' \
              drivers/media/platform/msm/camera/cam_utils/cam_trace.h

        - name: Fix DTC overlay (pre-CPP to resolve includes/macros)
          run: |
            # Preprocess dtsi via CPP to resolve all #include and #define,
            # suppress linemarkers (-P) so DTC's older parser doesn't choke.
            cpp -nostdinc -I scripts/dtc/include-prefixes -undef -D__DTS__ \
              -x assembler-with-cpp -P \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi \
              -o /tmp/sdmmagpie-clean.tmp
            cp /tmp/sdmmagpie-clean.tmp \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            # Belt-and-suspenders: replace any THERMAL_* that leaked through
            sed -i 's/THERMAL_NO_LIMIT/0xFFFFFFFF/g' \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
            sed -i 's/THERMAL_MAX_LIMIT/0xFFFFFFFE/g' \
              arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi

        - name: Build kernel + DTBs
          run: |
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error" -j Image.gz dtbs

        - name: Concatenate kernel + DTB into Image.gz-dtb
          run: |
            cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/xiaomi/laurel_sprout-trinket-base.dtb \
              > arch/arm64/boot/Image.gz-dtb
            ls -lh arch/arm64/boot/Image.gz-dtb

        - name: Upload Image.gz-dtb
          uses: actions/upload-artifact@v4
          with:
            name: Image.gz-dtb
            path: arch/arm64/boot/Image.gz-dtb
            if-no-files-found: error