name: Build Mi A3 Custom Kernel (laurel_sprout)

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev make cpio

      - name: Create custom config fragment
        run: |
          cat > arch/arm64/configs/vendor/laurel_sprout-custom.config << 'CONFIGEOF'
          CONFIG_IR_MSM_GENI=y
          CONFIG_RC_CORE=y
          CONFIG_USB_DWC3_DUAL_ROLE=y
          # CONFIG_BUILD_ARM64_DT_OVERLAY is not set
          CONFIGEOF

      - name: Configure kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/atoll-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O . .config \
            arch/arm64/configs/vendor/laurel_sprout.config \
            arch/arm64/configs/vendor/laurel_sprout-custom.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Fix GCC 13+ compatibility
        run: |
          sed -i '1s/^/#ifndef __has_attribute\n#define __has_attribute(x) 0\n#endif\n/' include/linux/compiler_types.h

      - name: Fix bolero format strings
        run: |
          sed -i 's/"%s: register macro successful:%d\\n"/"register macro successful:%d\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-cdc.c
          sed -i 's/"%s: dev is null %d\\n"/"%s: dev is null\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-clk-rsc.c

      - name: Fix cam_trace.h include path
        run: |
          sed -i 's|#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils|' \
            drivers/media/platform/msm/camera/cam_utils/cam_trace.h

      - name: Build kernel + DTBs
        run: |
          # Base DTB (laurel_sprout-trinket-base.dtb) is only built as a
          # dependency of the overlay; with DT overlays disabled we add it
          # explicitly so the concatenation step finds it.
          sed -i '/^endif$/a dtb-y += laurel_sprout-trinket-base.dtb' arch/arm64/boot/dts/xiaomi/Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error" -j$(nproc) Image.gz dtbs

      - name: Concatenate kernel + DTB
        run: |
          cat arch/arm64/boot/Image.gz \
            arch/arm64/boot/dts/xiaomi/laurel_sprout-trinket-base.dtb \
            > arch/arm64/boot/Image.gz-dtb
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error