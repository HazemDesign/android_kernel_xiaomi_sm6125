name: Build Mi A3 Custom Kernel (laurel_sprout)

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev make cpio

      - name: Create custom config fragment
        run: |
          cat > arch/arm64/configs/vendor/laurel_sprout-custom.config << 'CONFIGEOF'
          # Custom config for Mi A3 (laurel_sprout) - IR + OTG + Magisk fix
          # IR blaster: SPI IR LED driver (matches DTS "ir-spi-led")
          CONFIG_RC_CORE=y
          CONFIG_IR_SPI=y
          CONFIG_LIRC=y
          # USB OTG: DWC3 dual-role
          CONFIG_USB_DWC3_DUAL_ROLE=y
          # Magisk fix: disable static usermodehelper
          # CONFIG_STATIC_USERMODEHELPER is not set
          CONFIGEOF

      - name: Configure kernel (base + fragments)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/atoll-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O . .config \
            arch/arm64/configs/vendor/laurel_sprout.config \
            arch/arm64/configs/vendor/laurel_sprout-custom.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Fix GCC 13+ compatibility (__has_attribute)
        run: |
          sed -i '1s/^/#ifndef __has_attribute\n#define __has_attribute(x) 0\n#endif\n/' include/linux/compiler_types.h

      - name: Fix bolero format strings (GCC 13+ -Werror=format)
        run: |
          sed -i 's/"%s: register macro successful:%d\\n"/"register macro successful:%d\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-cdc.c
          sed -i 's/"%s: dev is null %d\\n"/"%s: dev is null\\n"/' techpack/audio/4.0/asoc/codecs/bolero/bolero-clk-rsc.c

      - name: Fix DTC overlay (inline thermal constants, no CPP)
        run: |
          sed -i '/#include <dt-bindings\/thermal\/thermal.h>/d' \
            arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
          sed -i 's/THERMAL_NO_LIMIT/0xFFFFFFFF/g' \
            arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi
          sed -i 's/THERMAL_MAX_LIMIT/0xFFFFFFFE/g' \
            arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi

      - name: Free up disk space
        run: |
          sudo apt-get clean
          df -h

      - name: Allocate swap (avoid OOM)
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=1024 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel Image.gz (serial, low-mem)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -pipe" KERNEL_EXTRA_FLAGS="-g0" \
            -j1 Image.gz

      - name: Build DTBs (serial)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j1 dtbs

      - name: Concatenate kernel + DTB into Image.gz-dtb
        run: |
          cat arch/arm64/boot/Image.gz \
            arch/arm64/boot/dts/xiaomi/laurel_sprout-trinket-base.dtb \
            > arch/arm64/boot/Image.gz-dtb
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error